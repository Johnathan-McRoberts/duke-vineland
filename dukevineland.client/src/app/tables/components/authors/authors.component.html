<p>authors works!</p>
<mat-spinner *ngIf="loading"></mat-spinner>

<div *ngIf="hasData">
  <div class="flex-container">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
    <mat-paginator #paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of authors"></mat-paginator>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource"
           #sort="matSort"
           matSortActive="name"
           matSortDisableClear
           matSortDirection="asc"
           matSort multiTemplateDataRows>

      <!--- Note that these columns can be defined in any order.
      The actual rendered columns are set as a property on the row definition" -->
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- nationality Column -->
      <ng-container matColumnDef="nationality">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> nationality </th>
        <td mat-cell *matCellDef="let element"> {{element.nationality}} </td>
      </ng-container>

      <!-- language Column -->
      <ng-container matColumnDef="language">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> language </th>
        <td mat-cell *matCellDef="let element"> {{element.language}} </td>
      </ng-container>

      <!-- Total Books Read Column -->
      <ng-container matColumnDef="totalBooksReadBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> # Books </th>
        <td mat-cell *matCellDef="let element"> {{element.totalBooksReadBy}} </td>
      </ng-container>

      <!-- Total Pages Column -->
      <ng-container matColumnDef="totalPages">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> # Pages </th>
        <td mat-cell *matCellDef="let element"> {{element.totalPages}} </td>
      </ng-container>

      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
        <td mat-cell *matCellDef="let element">

          <button mat-icon-button
                  aria-label="expand row"
                  (click)="toggle(element); $event.stopPropagation()"
                  class="example-toggle-button"
                  [class.example-toggle-button-expanded]="isExpanded(element)">
            <mat-icon>keyboard_arrow_down</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
          <div class="example-element-detail-wrapper"
               [class.example-element-detail-wrapper-expanded]="isExpanded(element)">
            <div class="example-element-detail" *ngIf="expandedElement">

              <div>
                <p>TBD books by {{element.name}}</p>
              </div>
            </div>


          </div>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="example-element-row"
          [class.example-expanded-row]="isExpanded(row)"
          (click)="toggle(row)">
      </tr>


      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>

    </table>

  </div>

</div>
